<script>
/* ===== LOGIC (toza funksiyalar, DOM'siz; Node'da sinab ko'riladi) ===== */
const DOMAINS = ["lifestyle", "nutrition", "stress_sleep", "spec", "history"];
const DOMAIN_LABEL = { lifestyle: "Turmush tarzi", nutrition: "Ovqatlanish", stress_sleep: "Uyqu va stress", spec: "Siklga / erkak omiliga oid", history: "Anamnez va ko'riklar" };
const W = { lifestyle: 0.25, nutrition: 0.15, stress_sleep: 0.2, spec: 0.25, history: 0.15 };

const o = (id, t, p, flag) => ({ id, t, p: p || {}, flag: flag || null });

const QS = {
  Q1: { code: "Q1", t: "Test kim uchun?", opts: [o("m", "Men — erkak"), o("f", "Men — ayol"), o("c", "Biz — juftlik")] },
  Q2: { code: "Q2", t: "Yoshingiz qaysi oraliqda? (juftlikda: kattangiz)", opts: [o("a", "18–24"), o("b", "25–29"), o("c", "30–34", { history: 1 }), o("d", "35–39", { history: 2 }), o("e", "40 va undan katta", { history: 3 })] },
  Q3: { code: "Q3", t: "Farzand rejalashtirganingizga qancha vaqt bo'ldi?", opts: [o("a", "Hali boshlamadik"), o("b", "6 oydan kam", {}), o("c", "6–12 oy", { history: 1 }), o("d", "12 oydan ko'p", { history: 2 })] },
  Q4: { code: "Q4", t: "Chekish va alkogol iste'moli", opts: [o("a", "Umuman yo'q"), o("b", "Ba'zan", { lifestyle: 1 }), o("c", "Muntazam", { lifestyle: 3 })] },
  Q5: { code: "Q5", t: "Haftasiga necha marta jismoniy faollik qilasiz?", opts: [o("a", "Deyarli yo'q", { lifestyle: 3 }), o("b", "1–2 marta", { lifestyle: 2 }), o("c", "3–4 marta"), o("d", "5 va undan ko'p")] },
  Q6: { code: "Q6", t: "Ovqatlanish tartibingiz qanday?", opts: [o("a", "Sabzavot, meva va oqsil muvozanatli"), o("b", "Ba'zan muvozanat buziladi", { nutrition: 1 }), o("c", "Ko'pincha tez ovqat va shirinlik", { nutrition: 3 })] },
  Q7: { code: "Q7", t: "Uyqu va stress holatingiz", opts: [o("a", "7–8 soat uxlayman, stress past"), o("b", "Uyqu yetarli, stress o'rtacha", { stress_sleep: 1 }), o("c", "6 soatdan kam yoki stress yuqori", { stress_sleep: 2 }), o("d", "Uyqu buzilgan va stress doimiy", { stress_sleep: 3 })] },
  A1: { code: "A1", t: "Hayz sikli muntazammi? (ayol uchun)", opts: [o("a", "Muntazam"), o("b", "Ba'zan buziladi", { spec: 1 }), o("c", "Juda tartibsiz yoki yo'q", { spec: 3 }, "CYCLE_IRREG")] },
  A2: { code: "A2", t: "Hayz davridagi og'riq darajasi (ayol uchun)", opts: [o("a", "Yo'q"), o("b", "Yengil", { spec: 1 }), o("c", "Kuchli, kundalik ishga xalaqit beradi", { spec: 2 }, "PAIN_SEVERE")] },
  A3: { code: "A3", t: "Shifokor sizga ginekologik holat borligini aytganmi?", opts: [o("n", "Yo'q"), o("u", "Bilmayman / eslolmayman", { history: 1 }), o("y", "Ha", { history: 3 }, "MED_HISTORY")] },
  A4: { code: "A4", t: "Oxirgi yilda vazningiz o'zgarganmi?", opts: [o("a", "Barqaror"), o("b", "3–5 kg o'zgardi", { lifestyle: 1 }), o("c", "5 kg dan ko'p o'zgardi", { lifestyle: 2 })] },
  A5: { code: "A5", t: "Gormonal kontratseptivlar qabul qilganmisiz?", opts: [o("a", "Hech qachon"), o("b", "Ha, 6 oydan oldin to'xtatganman"), o("c", "Ha, yaqinda to'xtatdim", { history: 1 })] },
  A6: { code: "A6", t: "Oxirgi 12 oyda ginekolog ko'rigidan o'tdingizmi?", opts: [o("y", "Ha"), o("n", "Yo'q", { history: 1 })] },
  E1: { code: "E1", t: "Issiqlik ta'siri: uzoq o'tirish, sauna/hammom, issiq ish muhiti (erkak uchun)", opts: [o("a", "Deyarli yo'q"), o("b", "Ba'zan", { spec: 1 }), o("c", "Muntazam", { spec: 3 })] },
  E2: { code: "E2", t: "Kasbingizda zararli omillar bormi? (kimyoviy, tebranish, uzoq haydash)", opts: [o("a", "Yo'q"), o("b", "Bitta omil", { spec: 1 }), o("c", "Bir nechta omil", { spec: 2 })] },
  E3: { code: "E3", t: "Shifokor sizga urologik yoki androlog holat borligini aytganmi?", opts: [o("n", "Yo'q"), o("u", "Bilmayman / eslolmayman", { history: 1 }), o("y", "Ha", { history: 3 }, "MED_HISTORY")] },
  E4: { code: "E4", t: "Vazn guruhingiz (tana massa indeksi bo'yicha, taxminan)", opts: [o("a", "Me'yorda"), o("b", "Biroz ortiqcha", { lifestyle: 1 }), o("c", "Sezilarli ortiqcha", { lifestyle: 2 })] },
  E5: { code: "E5", t: "Surunkali kasallik yoki muntazam dori qabul qilasizmi?", opts: [o("n", "Yo'q"), o("y", "Ha", { history: 3 }, "MED_HISTORY")] },
  E6: { code: "E6", t: "Oxirgi 12 oyda urolog ko'rigi yoki spermogramma bo'lganmi?", opts: [o("y", "Ha"), o("n", "Yo'q", { history: 1 })] },
  Q14: { code: "Q14", t: "Hozir vitamin yoki qo'shimcha qabul qilasizmi?", opts: [o("a", "Yo'q"), o("b", "Ha, shifokor bilan kelishganman"), o("c", "Ha, o'zim tanlaganman", { lifestyle: 1 })] },
  Q15: { code: "Q15", t: "Tavsiyani qaysi kanalda olishni xohlaysiz?", opts: [o("tg", "Telegram"), o("ph", "Telefon"), o("web", "Faqat saytda")] },
};

const COMMON = ["Q2", "Q3", "Q4", "Q5", "Q6", "Q7"];
const FLOW = {
  m: ["Q1", ...COMMON, "E1", "E2", "E3", "E4", "E5", "E6", "Q14", "Q15"],
  f: ["Q1", ...COMMON, "A1", "A2", "A3", "A4", "A5", "A6", "Q14", "Q15"],
  c: ["Q1", ...COMMON, "A1", "A3", "A6", "E1", "E3", "E6", "Q14", "Q15"],
};
const PART_CODES = {
  m: { "Erkak": [...COMMON, "E1", "E2", "E3", "E4", "E5", "E6", "Q14"] },
  f: { "Ayol": [...COMMON, "A1", "A2", "A3", "A4", "A5", "A6", "Q14"] },
  c: { "Ayol": [...COMMON, "A1", "A3", "A6", "Q14"], "Erkak": [...COMMON, "E1", "E3", "E6", "Q14"] },
};

function domainScores(codes, answers) {
  const out = {};
  for (const d of DOMAINS) {
    let sum = 0, max = 0;
    for (const c of codes) {
      const q = QS[c];
      max += Math.max(0, ...q.opts.map((x) => x.p[d] || 0));
      const op = q.opts.find((x) => x.id === answers[c]);
      if (op) sum += op.p[d] || 0;
    }
    out[d] = max ? Math.round(100 * (1 - Math.min(sum / max, 1))) : null;
  }
  return out;
}
function indexOf(ds) {
  let tw = 0, s = 0;
  for (const d of DOMAINS) { if (ds[d] == null) continue; tw += W[d]; s += W[d] * ds[d]; }
  return tw ? Math.round(s / tw) : 0;

function retrieve(query, kb) {
  const docs = kb.filter((c) => c.status === "published");
  const q = toks(query);
  if (!q.length || !docs.length) return [];
  const sets = docs.map((c) => new Set(toks(c.title + " " + c.keywords + " " + c.text)));
  const N = docs.length;
  const idf = {};
  for (const w of new Set(q)) { const df = sets.filter((s) => s.has(w)).length; idf[w] = Math.log(1 + N / (df + 0.5)); }
  const total = Object.values(idf).reduce((s, x) => s + x, 0) || 1;
  return docs
    .map((c, i) => {
      const hit = [...new Set(q)].filter((w) => sets[i].has(w));
      const kw = new Set(toks(c.title + " " + c.keywords));
      const bonus = hit.filter((w) => kw.has(w)).length * 0.04;
      return { doc: c, score: Math.min(1, hit.reduce((s, w) => s + idf[w], 0) / total + bonus), hit };

function agg() {
  const keys = ["page_view", "quiz_start", "quiz_finish", "lead_created", "checkout_start", "purchase"];
  const out = {};
  for (const ch of CHANNELS) { out[ch] = { ...DB.base[ch], revenue: DB.base[ch].purchase * DB.baseAov }; }
  for (const e of DB.events) { const ch = out[e.src] ? e.src : "direct"; if (keys.includes(e.name)) out[ch][e.name] = (out[ch][e.name] || 0) + 1; }
  for (const o of DB.orders) { if (o.sample) continue; if (["paid", "placed", "packed", "shipped", "delivered"].includes(o.status)) { const ch = out[o.last.utm_source] ? o.last.utm_source : "direct"; out[ch].revenue += o.total; } }
  const tot = { spend: 0, revenue: 0 };
  for (const k of keys) tot[k] = 0;
  for (const ch of CHANNELS) { for (const k of keys) tot[k] += out[ch][k]; tot.spend += out[ch].spend; tot.revenue += out[ch].revenue; }
  return { out, tot, keys };
}
const pct = (a, b) => (b ? (100 * a / b).toFixed(1) + "%" : "—");
function adminDash() {
  const { out, tot } = agg();
  const steps = [["Tashrif", "page_view"], ["Test boshladi", "quiz_start"], ["Test tugatdi", "quiz_finish"], ["Lid", "lead_created"], ["Checkout", "checkout_start"], ["Xarid", "purchase"]];
  const max = tot.page_view || 1;
  return `<div class="stack"><p class="notice small">Ko'rsatkichlar = namuna tarixiy ma'lumot + siz demoda qilgan harakatlar. Hisobotlar oxirgi tegishli (last non-direct) manba bo'yicha.</p>

  <div class="tbl"><table><thead><tr><th>Manba</th><th class="n">Tashrif</th><th class="n">Test</th><th class="n">Lid</th><th class="n">Xarid</th><th class="n">Xarajat</th><th class="n">CPL</th><th class="n">ROAS</th></tr></thead><tbody>

  return `<section class="stack" style="padding-top:24px;padding-bottom:24px"><div class="row" style="justify-content:space-between"><h2>Admin panel</h2><span class="pill sample">demo: kirish himoyasi o'chirilgan</span></div>

}

const VIEWS = { contact: viewContact, home: viewHome, quiz: viewQuiz, result: viewResult, ai: viewAI, order: viewOrder, done: viewDone, admin: viewAdmin };
function render() {

function syncPacks() { document.querySelectorAll(".pack").forEach((l) => { const i = l.querySelector("input"); l.classList.toggle("on", !!(i && i.checked)); }); }
function go(v) { if (v !== S.view) pushView(v); S.view = v; track("page_view", { view: v }); if (v === "order" && !S.coTracked) { S.coTracked = true; track("checkout_start"); } render(); window.scrollTo(0, 0); }

/* ---------- harakatlar ---------- */
function startQuiz(sc) {
  S.quiz = { sc: sc || null, answers: sc ? { Q1: sc } : {}, i: sc ? 1 : 0, started: !!sc };
  if (sc) track("quiz_start", { scenario: sc });
  if (S.view !== "quiz") pushView("quiz");
  S.view = "quiz"; render(); window.scrollTo(0, 0);
}
function answerQ(oid) {
  const q = curQ();
  if (q.code === "Q1") {
    if (S.quiz.sc !== oid) S.quiz.answers = {};
    S.quiz.sc = oid;
    if (!S.quiz.started) { S.quiz.started = true; track("quiz_start", { scenario: oid }); }
  }
  S.quiz.answers[q.code] = oid;
  S.quiz.i++;
  if (S.quiz.i >= 15) return finishQuiz();
  render();
}
function finishQuiz() {
  const sc = S.quiz.sc;
  if (!isComplete(sc, S.quiz.answers)) { S.quiz.i = Math.max(0, flowCodes(sc).findIndex((c) => !S.quiz.answers[c])); render(); return; }
  S.result = computeResult(sc, S.quiz.answers);
  S.lead = null;
  track("quiz_finish", { index: S.result.index, band: S.result.band, flags: S.result.flags.length });
  pushView("result"); S.view = "result"; render(); window.scrollTo(0, 0);
}
function netlifySend(kind, f, rec) {
  if (!CONFIG.ntl || typeof fetch !== "function" || !/^https?:/.test(location.protocol)) return;
  const u = S.touch, data = Object.assign({ "form-name": "leads", "bot-field": "", kind, source: srcLabel(u), utm_source: u.utm_source || "", utm_medium: u.utm_medium || "", utm_campaign: u.utm_campaign || "", utm_content: u.utm_content || "", first_source: srcLabel(S.first) }, f);
  const body = new URLSearchParams(); Object.keys(data).forEach((k) => body.append(k, data[k] == null ? "" : String(data[k])));
  try {
    fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() })
      .then((r) => { if (rec) { rec.sync = r.ok ? "netlify" : "local"; save(); } })
      .catch(() => { if (rec) { rec.sync = "local"; save(); } });
  } catch (e) { if (rec) rec.sync = "local"; }
}
function deliver(kind, f, rec) {
  const live = CONFIG.api && typeof fetch === "function" && /^https?:/.test(location.protocol);
  if (!live) return netlifySend(kind, f, rec);
  const u = S.touch;
  const payload = Object.assign({ kind, source: srcLabel(u), utm_source: u.utm_source || "", utm_medium: u.utm_medium || "", utm_campaign: u.utm_campaign || "", utm_content: u.utm_content || "", first_source: srcLabel(S.first), token: (rec && rec.token) || "", bot_field: "" }, f);
  try {
    fetch("/api/lead", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then((r) => { if (r.ok) { if (rec) { rec.sync = "server"; save(); } } else netlifySend(kind, f, rec); })
      .catch(() => netlifySend(kind, f, rec));
  } catch (e) { netlifySend(kind, f, rec); }
}
function chatNote() { return S.chat.filter((m) => m.role === "user" || m.role === "ai").slice(-4).map((m) => (m.role === "user" ? "Mijoz: " : "AI: ") + m.text.slice(0, 200)).join("\n"); }
function submitCallback(ev) {
  ev.preventDefault();
  if ($("#cb_hp").value) return; // bot tuzog'i
  const phone = $("#cb_phone").value, consent = $("#cb_consent").checked;
  $("#e_cb_phone").textContent = validPhone(phone) ? "" : "Telefon raqamini to'liq kiriting (9 raqam)";
  $("#e_cb_consent").textContent = consent ? "" : "Davom etish uchun rozilik kerak";
  if (!validPhone(phone) || !consent) return;
  const p = phoneLocal(phone), time = $("#cb_time").value, name = $("#cb_name").value.trim();
  const r = S.result;
  let lead = DB.leads.find((l) => l.p9 === p);
  if (lead) { lead.callback = true; lead.cbTime = time; if (lead.status === "lost") lead.status = "new"; if (name && /kiritilmagan/.test(lead.name)) lead.name = name; }
  else {
    lead = { id: "L" + ++DB.seq.lead, name: name || (S.tg && S.tg.name) || "Ism kiritilmagan", phone: "+998 (" + p.slice(0, 2) + ") " + p.slice(2, 5) + "-••-••", p9: p, scenario: r ? r.scenario : null, index: r ? r.index : null, band: r ? r.band : null, flags: r ? r.flags : [], weak: r ? r.weak : [], grade: r ? leadGrade(r, true) : "B", first: S.first, last: S.touch, status: "new", tg: !!S.tg, bought: false, flagged: !!(r && r.flags.length), t: Date.now(), sample: false, callback: true, cbTime: time, token: Math.random().toString(36).slice(2, 12) };
    DB.leads.push(lead); track("lead_created", { channel: "callback" });
  }
  track("callback_request", { time });
  S.lead = lead; S.cbDone = { time, work: workHours(new Date()) };
  deliver("callback", { name: lead.name, phone: fmtPhone(p), time, scenario: r ? r.scenario : "", index: r ? r.index : "", band: r ? r.band : "", flags: r ? r.flags.join(",") : "", grade: lead.grade, note: S.chatState === "handed" ? chatNote() : "", consent: "yes" }, lead);
  save(); render();
}
function showView(v) {
  const okV = { home: 1, ai: 1, order: 1, admin: 1, contact: 1, result: !!S.result, done: !!S.orderDone, quiz: S.quiz.i < 15 };
  S.view = okV[v] ? v : "home"; render(); window.scrollTo(0, 0);

window.addEventListener("popstate", (e) => showView(e.state && e.state.mf ? e.state.mf : "home"));
try { history.replaceState({ mf: "home" }, ""); } catch (e) { /* tarix yopiq */ }

  try {

try {
  if (/Telegram/i.test(UA) || /tgWebApp/.test(location.hash)) {

} catch (e) { /* ignore */ }
function submitLead(ev) {
  ev.preventDefault();
  const phone = $("#l_phone").value, consent = $("#l_consent").checked;
  $("#e_l_phone").textContent = validPhone(phone) ? "" : "Telefon raqamini to'liq kiriting (9 raqam)";

  const p = phoneLocal(phone); lead.phone = "+998 (" + p.slice(0, 2) + ") " + p.slice(2, 5) + "-••-••";

  deliver("quiz", { name: lead.name, phone: fmtPhone(p), scenario: r.scenario, index: r.index, band: r.band, flags: r.flags.join(","), grade: lead.grade, marketing: lead.mkt ? "yes" : "no", consent: "yes" }, lead);
  save(); render();
}
function addHandoff(code, priority) {
  const r = S.result;
  const last = [...S.chat].reverse().find((m) => m.role === "user");
  const h = { id: "H" + ++DB.seq.ho, reason: code, priority, status: "open", t: Date.now(),
    summary: `${r ? `Test: ${SC_LABEL[r.scenario]}, indeks ${r.index} (${BAND_LABEL[r.band]}), bayroqlar: ${r.flags.length ? r.flags.join(", ") : "yo'q"}. ` : "Test o'tilmagan. "}Manba: ${srcLabel(S.touch)}. Oxirgi savol: «${last ? last.text : "—"}».` };
  DB.handoffs.push(h); S.chatState = "handed"; track("ai_handoff", { reason: code });
  const open = workHours(new Date());
  S.chat.push({ role: "sys", text: open ? "Suhbat menejerga uzatildi. Menejer ish vaqtida (09:00–21:00) javob beradi." : "Hozir ish vaqtidan tashqari. Menejer ertaga 09:00 dan keyin bog'lanadi; ma'lumotlaringiz saqlandi." });
  save();
}
let chatBusy = false;
function sendChat(text) {
  text = String(text || "").trim().slice(0, 300);
  if (!text || chatBusy) return;
  S.chat.push({ role: "user", text }); track("ai_message");
  if (S.chatState === "handed") { S.chat.push({ role: "sys", text: "Suhbat menejerga uzatilgan. Menejer javobini kuting (Admin → Handoff orqali javob yuborib ko'ring)." }); render(); return; }
  const live = CONFIG.api && typeof fetch === "function" && /^https?:/.test(location.protocol);
  if (!live) return finishChat(answer(text, DB.kb));
  const hist = S.chat.filter((m) => (m.role === "user" || m.role === "ai") && !m.greet).slice(-7, -1).map((m) => ({ role: m.role === "ai" ? "assistant" : "user", content: m.text }));
  chatBusy = true; S.chat.push({ role: "sys", text: "Javob tayyorlanmoqda...", pending: true }); render();
  let p;
  try {
    p = fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, history: hist, context: S.result ? { index: S.result.index, band: S.result.band } : undefined }) })
      .then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then((r) => { if (!r || !r.ok || typeof r.text !== "string") throw new Error("bad"); r.hits = (r.hits || []).map((h) => ({ doc: { id: h.id, title: h.title }, score: h.score })); return r; });
  } catch (e) { p = Promise.reject(e); }
  p.catch(() => Object.assign(answer(text, DB.kb), { via: "demo-zaxira" }))
    .then((r) => { chatBusy = false; S.chat = S.chat.filter((m) => !m.pending); finishChat(r); });
}
function finishChat(r) {
  S.trace = r;
  const auto = r.handoff && (r.handoff.code === "URGENT" || r.handoff.code === "USER_ASK");
  S.chat.push({ role: "ai", text: r.text, sources: r.sources, offer: r.handoff && !auto ? r.handoff : null });
  if (auto) addHandoff(r.handoff.code, r.handoff.priority);
  render(); const i = $("#chatIn"); if (i) i.focus();
}
function fillDistricts() {
  const r = REGIONS.find((x) => x.id === $("#f_region").value);
  $("#f_district").innerHTML = r ? `<option value="">Tanlang</option>` + r.d.map((d) => `<option>${esc(d)}</option>`).join("") : `<option value="">Avval viloyatni tanlang</option>`;
}
function submitOrder(ev) {
  ev.preventDefault();
  const f = { name: $("#f_name").value, phone: $("#f_phone").value, region: $("#f_region").value, district: $("#f_district").value, address: $("#f_addr").value, adult: $("#f_adult").checked, consent: $("#f_consent").checked };
  const e = validateOrder(f);
  for (const k of ["name", "phone", "region", "district", "address", "adult", "consent"]) { const el = $("#e_" + k); if (el) el.textContent = e[k] || ""; }
  if (Object.keys(e).length) { const first = $(".err:not(:empty)"); if (first) first.scrollIntoView({ block: "center" }); return; }
  const qty = Number($('input[name="qty"]:checked').value), pay = $('input[name="pay"]:checked').value;
  const reg = REGIONS.find((x) => x.id === f.region);
  const c = calcOrder(DB.prices[qty], 1, $("#f_promo").value, reg.z);
  let lead = S.lead;
  const p = phoneLocal(f.phone);
  if (!lead) { lead = { id: "L" + ++DB.seq.lead, name: f.name.trim(), phone: "+998 (" + p.slice(0, 2) + ") " + p.slice(2, 5) + "-••-••", scenario: null, index: null, band: null, flags: [], weak: [], grade: "B", first: S.first, last: S.touch, status: "ordered", tg: false, bought: true, flagged: false, t: Date.now(), sample: false, p9: p }; DB.leads.push(lead); track("lead_created", { channel: "order_form" }); }
  lead.bought = true; lead.status = "ordered";
  const o = { id: "MF-" + ++DB.seq.order, lead: lead.id, name: f.name.trim(), qty, total: c.total, region: reg.n, district: f.district, pay, status: pay === "cod" ? "placed" : "pending_payment", last: S.touch, t: Date.now(), sample: false };
  deliver("order", { name: f.name.trim(), phone: fmtPhone(p), region: reg.n, district: f.district, address: f.address.trim(), qty, total: c.total, pay, promo: $("#f_promo").value.trim(), order_id: o.id, consent: "yes" }, o);
  DB.orders.push(o); S.orderDone = o; if (pay === "cod") track("purchase", { value: o.total });
  S.coTracked = false; save(); pushView("done"); S.view = "done"; render(); window.scrollTo(0, 0);
}

const A = {
  nav: (d) => { if (d.v === "quiz") return startQuiz(S.quiz.i > 0 && S.quiz.i < 15 ? S.quiz.sc : null); go(d.v); },
  startQuiz: (d) => startQuiz(d.sc),
  ans: (d) => answerQ(d.o),
  back: () => { if (S.quiz.i <= 0) go("home"); else { S.quiz.i--; render(); } },
  chip: (d) => sendChat(d.q),
  handoff: (d) => { addHandoff(d.code, d.pr); const m = S.chat[Number(d.i)]; if (m) m.offer = null; render(); },
  bindTg: () => { if (S.lead) { S.lead.tg = true; save(); render(); } },
  pay: () => { const o = S.orderDone; if (o && o.status === "pending_payment") { o.status = "paid"; track("purchase", { value: o.total }); const l = DB.leads.find((x) => x.id === o.lead); if (l) l.status = "paid"; save(); render(); } },
  togglePh: () => { S.showPh = !S.showPh; render(); },
  adminTab: (d) => { S.adminTab = d.v; render(); },
  selLead: (d) => { S.selLead = S.selLead === d.id ? null : d.id; render(); },
  agentReply: (d) => { const el = $("#hr_" + d.id); const t = el && el.value.trim(); if (!t) return; S.chat.push({ role: "agent", text: "Menejer: " + t }); const h = DB.handoffs.find((x) => x.id === d.id); if (h) h.status = "taken"; save(); render(); },
  closeHo: (d) => { const h = DB.handoffs.find((x) => x.id === d.id); if (h) h.status = "resolved"; if (!DB.handoffs.some((x) => x.status === "open" || x.status === "taken")) S.chatState = "ai"; save(); render(); },
  reset: () => { DB = seedDB(); S.chat = S.chat.slice(0, 1); S.chatState = "ai"; S.trace = null; S.lead = null; S.orderDone = null; S.selLead = null; save(); render(); },
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-a]"); if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset); });
document.addEventListener("submit", (e) => {
  const id = e.target.id;
  if (id === "leadForm") submitLead(e);
  else if (id === "cbForm") submitCallback(e);
  else if (id === "orderForm") submitOrder(e);
  else if (id === "chatForm") { e.preventDefault(); const i = $("#chatIn"); const v = i.value; i.value = ""; sendChat(v); }
  else if (id === "kbForm") {
    e.preventDefault();
    const title = $("#k_title").value.trim(), text = $("#k_text").value.trim();
    if (!title || text.length < 10) { S.kbMsg = { ok: false, t: "Sarlavha va kamida 10 belgilik matn kerak." }; return render(); }
    const bad = validateClaim(text);
    if (bad.length) { S.kbMsg = { ok: false, t: "Saqlanmadi: matnda taqiqlangan da'vo bor (" + esc(bad.join(", ")) + "). Matnni tibbiy jihatdan neytral qilib qayta yozing." }; return render(); }
    DB.kb.push({ id: "kb" + (DB.kb.length + 1), title, type: $("#k_type").value, status: "draft", keywords: $("#k_kw").value, text });
    S.kbMsg = { ok: true, t: "Qoralama saqlandi. Nashr qilish uchun holatini published ga o'tkazing." }; save(); render();
  } else if (id === "priceForm") {
    e.preventDefault();
    const np = {}; let okAll = true;
    for (const q of [1, 2, 3]) { const v = Number($("#p_" + q).value); if (!(v >= 1000)) okAll = false; np[q] = v; }
    if (!okAll) { S.priceMsg = { ok: false, t: "Narx kamida 1 000 so'm bo'lishi kerak." }; return render(); }
    for (const q of [1, 2, 3]) if (np[q] !== DB.prices[q]) { DB.priceHistory.push({ t: Date.now(), q, from: DB.prices[q], to: np[q] }); DB.prices[q] = np[q]; }
    S.priceMsg = { ok: true, t: "Narxlar saqlandi." }; save(); render();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target, ch = t.dataset.ch;
